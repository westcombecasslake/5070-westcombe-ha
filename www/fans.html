<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan & Humidity Monitor</title>
<style>
  :root {
    --bg: #f0f2f0;
    --surface: #ffffff;
    --border: #dde8dd;
    --border-top: #2ecc8a;
    --teal: #2ecc8a;
    --teal-dim: #1a9e68;
    --teal-bg: #eafaf3;
    --amber: #e6a817;
    --amber-bg: #fef8e7;
    --amber-border: #f5d87a;
    --blue: #3a8fd4;
    --blue-bg: #eaf3fb;
    --blue-border: #a8d0ef;
    --red: #e05252;
    --red-bg: #fdeaea;
    --text: #1a2e22;
    --text-muted: #6b8f72;
    --text-dim: #9fb8a3;
    --font: -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    min-height: 100vh;
    padding: 0;
  }
  .page-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .page-title { font-size: 20px; font-weight: 600; color: var(--text); }
  .page-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .page-meta { text-align: right; font-size: 12px; color: var(--text-muted); }
  .page-meta .date { font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .content { padding: 24px 28px; max-width: 1400px; }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    margin-top: 28px;
  }
  .section-label:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--border-top);
    border-radius: 4px;
    padding: 16px;
  }
  .card.card-blue { border-top-color: var(--blue); }
  .card.card-amber { border-top-color: var(--amber); }
  .card.card-dim { border-top-color: var(--border); }
  .card-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 10px; }
  .value-row { display: flex; align-items: baseline; gap: 4px; margin-bottom: 6px; }
  .value { font-size: 28px; font-weight: 300; color: var(--teal); line-height: 1; }
  .value.warn { color: var(--amber); }
  .value.hot { color: var(--red); }
  .unit { font-size: 13px; color: var(--text-muted); }
  .bar-track { height: 3px; background: var(--bg); border-radius: 2px; margin-bottom: 8px; }
  .bar-fill { height: 3px; border-radius: 2px; background: var(--teal); transition: width 1s; }
  .bar-fill.warn { background: var(--amber); }
  .bar-fill.hot { background: var(--red); }
  .threshold-note { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .divider { border-top: 1px solid var(--border); margin: 10px 0; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 500;
    margin-bottom: 4px;
  }
  .pill-idle { background: var(--bg); color: var(--text-muted); }
  .pill-running { background: var(--teal-bg); color: var(--teal-dim); }
  .pill-boost { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-teal { background: var(--teal); }
  .dot-blue { background: var(--blue); }
  .dot-dim { background: var(--text-dim); }
  .progress-track { height: 2px; background: var(--bg); border-radius: 2px; margin-top: 4px; }
  .progress-fill { height: 2px; border-radius: 2px; transition: width 1s; }
  .pf-teal { background: var(--teal); }
  .pf-blue { background: var(--blue); }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 20px;
  }
  .badge-teal { background: var(--teal-bg); color: var(--teal-dim); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-gray { background: var(--bg); color: var(--text-muted); }
  .ref-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--bg); }
  .ref-row:last-child { border-bottom: none; }
  .ref-key { color: var(--text-muted); }
  .ref-val { color: var(--text); font-weight: 500; }
  .laundry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  footer {
    margin: 32px 28px 0;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
  .loading { color: var(--text-dim); font-size: 12px; padding: 8px 0; }
</style>
</head>
<body>

<div class="page-header">
  <div>
    <div class="page-title">Fan & Humidity Monitor</div>
    <div class="page-sub">West Bloomfield · Environmental</div>
  </div>
  <div class="page-meta">
    <div class="date" id="date">--</div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div class="content">
  <div class="section-label">Bathrooms</div>
  <div class="grid" id="bath-grid">
    <div class="card card-dim"><div class="loading">Connecting...</div></div>
    <div class="card card-dim"><div class="loading">Connecting...</div></div>
    <div class="card card-dim"><div class="loading">Connecting...</div></div>
  </div>

  <div class="section-label">Laundry</div>
  <div class="laundry-grid" id="laundry-grid">
    <div class="card card-dim"><div class="loading">Connecting...</div></div>
    <div class="card card-dim"><div class="loading">Connecting...</div></div>
  </div>
</div>

<footer>
  <span>Refreshes every 30s</span>
  <span id="last-update">Never updated</span>
</footer>

<script>
const HA = 'https://45yt8uxuisvmflbjzkczr77kr1jum1m0.ui.nabu.casa';
const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiIzY2U3OWJjYTQxOTI0YTNjYjM3ODM0ODlmZTBhMmI3MiIsImlhdCI6MTc3MjM5ODMwNywiZXhwIjoyMDg3NzU4MzA3fQ.UyfL-yfcrwXyA0tLisX9GkSdJ8o8FUfRGk5NEEsAq0s';

const ENTITIES = [
  'sensor.master_bath_humidity','sensor.middle_bath_humidity','sensor.east_suite_bathroom_humidity',
  'switch.master_bath_fan','switch.middle_bath_humidity','switch.east_suite_bathroom_humidity',
  'input_number.master_bath_humidity_baseline','input_number.master_bath_fan_loop_start',
  'input_number.middle_bath_humidity_baseline','input_number.middle_bath_fan_loop_start',
  'input_number.east_bath_humidity_baseline','input_number.east_bath_fan_loop_start',
  'sensor.laundry_temperature','switch.laundry_fan_timer',
  'sensor.dryer_monitor_current_power','input_number.laundry_temp_baseline',
  'script.hvac_exhaust_boost',
];

const BATHS = [
  { name: 'Master bath', humidity: 'sensor.master_bath_humidity', fan: 'switch.master_bath_fan', baseline: 'input_number.master_bath_humidity_baseline', loop: 'input_number.master_bath_fan_loop_start' },
  { name: 'Middle bath', humidity: 'sensor.middle_bath_humidity', fan: 'switch.middle_bath_humidity', baseline: 'input_number.middle_bath_humidity_baseline', loop: 'input_number.middle_bath_fan_loop_start' },
  { name: 'East suite',  humidity: 'sensor.east_suite_bathroom_humidity', fan: 'switch.east_suite_bathroom_humidity', baseline: 'input_number.east_bath_humidity_baseline', loop: 'input_number.east_bath_fan_loop_start' },
];

async function fetchStates() {
  const params = ENTITIES.map(e => `entity_id=${e}`).join('&');
  const res = await fetch(`${HA}/api/states?${params}`, {
    headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const map = {};
  data.forEach(e => { map[e.entity_id] = e; });
  return map;
}

function getVal(map, id, fallback=0) {
  const e = map[id];
  if (!e) return fallback;
  const v = parseFloat(e.state);
  return isNaN(v) ? fallback : v;
}

function getState(map, id) { return map[id] ? map[id].state : 'unknown'; }

function bathStatus(fanOn, baseline, loopStart) {
  const now = Date.now() / 1000;
  if (fanOn && baseline > 0) {
    const elapsed = loopStart > 0 ? now - loopStart : 0;
    const remaining = Math.max(0, 30*60 - elapsed);
    const pct = Math.min(100, (elapsed/(30*60))*100);
    return { state:'running', label:`Fan running · ${Math.ceil(remaining/60)}m remaining`, pct, color:'teal' };
  }
  if (fanOn && baseline === 0) {
    return { state:'manual', label:'Fan on · manual', pct:0, color:'teal' };
  }
  return { state:'idle', label:'Idle', pct:0, color:'dim' };
}

function renderBath(room, map, boostOn) {
  const hum = getVal(map, room.humidity);
  const fanOn = getState(map, room.fan) === 'on';
  const baseline = getVal(map, room.baseline);
  const loopStart = getVal(map, room.loop);
  const status = bathStatus(fanOn, baseline, loopStart);
  const isWarn = hum >= 55;
  const cycleComplete = !fanOn && baseline === 0 && boostOn;
  const thresh = hum < 50 ? '8% rise · below 50%' : '5% rise · above 50%';
  const barPct = Math.min(100, hum);

  let cardClass = 'card';
  if (cycleComplete) cardClass += ' card-blue';
  else if (status.state === 'running' || status.state === 'manual') cardClass += '';
  else cardClass += ' card-dim';

  let pillHtml = '';
  if (status.state === 'running') {
    pillHtml = `<div class="status-pill pill-running"><div class="dot dot-teal"></div>${status.label}</div>
      <div class="progress-track"><div class="progress-fill pf-teal" style="width:${status.pct}%"></div></div>`;
  } else if (status.state === 'manual') {
    pillHtml = `<div class="status-pill pill-running"><div class="dot dot-teal"></div>Fan on · manual</div>`;
  } else {
    pillHtml = `<div class="status-pill pill-idle"><div class="dot dot-dim"></div>${cycleComplete ? 'Cycle complete' : 'Idle'}</div>`;
  }

  let boostHtml = '';
  if (cycleComplete) {
    boostHtml = `<div class="status-pill pill-boost" style="margin-top:6px"><div class="dot dot-blue"></div>HVAC boost running</div>`;
  }

  return `<div class="${cardClass}">
    <div class="card-name">${room.name}</div>
    <div class="value-row">
      <div class="value ${isWarn ? 'warn' : ''}">${hum.toFixed(1)}</div>
      <div class="unit">%RH</div>
    </div>
    <div class="bar-track"><div class="bar-fill ${isWarn ? 'warn' : ''}" style="width:${barPct}%"></div></div>
    <div class="threshold-note">Threshold: ${thresh}</div>
    <div class="divider"></div>
    ${pillHtml}
    ${boostHtml}
  </div>`;
}

function renderLaundry(map, boostOn) {
  const temp = getVal(map, 'sensor.laundry_temperature');
  const fanOn = getState(map, 'switch.laundry_fan_timer') === 'on';
  const power = getVal(map, 'sensor.dryer_monitor_current_power');
  const baseline = getVal(map, 'input_number.laundry_temp_baseline');
  const dryerOn = power > 200;
  const cutoff = baseline + 3;
  const isWarm = baseline > 0 && temp > cutoff;

  const liveCard = `<div class="card ${isWarm ? 'card-amber' : fanOn ? '' : 'card-dim'}">
    <div class="card-name">Laundry room</div>
    <div class="value-row">
      <div class="value ${isWarm ? 'warn' : ''}">${temp.toFixed(1)}</div>
      <div class="unit">°F</div>
    </div>
    <div class="bar-track"><div class="bar-fill ${isWarm ? 'warn' : ''}" style="width:${Math.min(100,(temp/120)*100)}%"></div></div>
    ${baseline > 0
      ? `<div class="threshold-note">Baseline: ${baseline.toFixed(1)}°F · cutoff: ${cutoff.toFixed(1)}°F</div>`
      : '<div class="threshold-note">No active baseline</div>'}
    <div class="divider"></div>
    <div class="badge-row">
      ${dryerOn ? `<span class="badge badge-amber">Dryer on · ${Math.round(power)}W</span>` : `<span class="badge badge-gray">Dryer off</span>`}
      ${fanOn ? `<span class="badge badge-teal">Fan running</span>` : `<span class="badge badge-gray">Fan off</span>`}
      ${boostOn ? `<span class="badge badge-blue">HVAC boost</span>` : ''}
    </div>
  </div>`;

  const refCard = `<div class="card card-dim">
    <div class="card-name">Coded thresholds</div>
    <div class="divider" style="margin-top:0"></div>
    <div class="ref-row"><span class="ref-key">Dryer on</span><span class="ref-val">&gt; 200W</span></div>
    <div class="ref-row"><span class="ref-key">Dryer off</span><span class="ref-val">&lt; 2W</span></div>
    <div class="ref-row"><span class="ref-key">Cooldown target</span><span class="ref-val">Baseline + 3°F</span></div>
    <div class="ref-row"><span class="ref-key">Max runtime</span><span class="ref-val">45 min</span></div>
    <div class="ref-row"><span class="ref-key">Current power</span><span class="ref-val">${Math.round(power)}W</span></div>
  </div>`;

  return liveCard + refCard;
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = 'Updated ' + now.toLocaleTimeString();
  document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
}

async function refresh() {
  try {
    const map = await fetchStates();
    const boostOn = getState(map, 'script.hvac_exhaust_boost') === 'on';
    document.getElementById('bath-grid').innerHTML = BATHS.map(b => renderBath(b, map, boostOn)).join('');
    document.getElementById('laundry-grid').innerHTML = renderLaundry(map, boostOn);
    document.getElementById('last-update').textContent = 'Last updated ' + new Date().toLocaleTimeString();
  } catch(err) {
    document.getElementById('last-update').textContent = 'Error: ' + err.message;
  }
}

updateClock();
setInterval(updateClock, 1000);
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
