###############################################################################
# IRRIGATION
###############################################################################
#
# PURPOSE:
# Controls single-zone back patio drip irrigation via Insteon outlet.
# Weather-aware scheduling with manual override and deadman safety.
#
# OPERATION:
# - System enable helper (input_boolean) acts as seasonal on/off switch
# - Daily runtime calculated at 6 AM using temperature + humidity (ET-based)
# - Automatic cycle runs at 7:45 AM if system enabled and no rain forecast
# - Manual 30-minute run available via dashboard button
# - Deadman safety forces shutoff if valve stays on 90+ minutes
#
# ET RUNTIME FORMULA:
# - temp_factor  = ((temp - 40) * 0.6) + 8        range: ~8-46 min
# - humidity_mod = 1.4 - (humidity / 100)          range: 0.4-1.4x
# - runtime      = temp_factor * humidity_mod       clamped: 10-40 min
# - Tuned for mixed drip (pots + established birch tree)
# - Examples: 55F/60%RH = 14 min | 70F/50%RH = 23 min | 90F/30%RH = 40 min
#
# WEATHER SKIP:
# - Skips silently if system is disabled (seasonal shutoff)
# - Skips if current weather state is rainy/pouring/lightning-rainy/snowy-rainy
# - Skips if today's or tomorrow's forecast condition is in the same bad list
# - Note: Met.no does not provide precipitation probability (PoP) data
#
# NOTIFICATIONS:
# - operational_log: cycle start, cycle skip with reason (weather only)
# - house_notices: manual run start
# - house_alerts: deadman safety triggered
#
###############################################################################

input_boolean:
  irrigation_system_enabled:
    name: Irrigation System Enabled
    icon: mdi:water-check

input_number:
  irrigation_zone_runtime:
    name: Irrigation Zone Runtime
    min: 0
    max: 40
    step: 1
    unit_of_measurement: "min"

input_button:
  irrigation_manual_30min:
    name: Irrigation Manual Run (30 Minutes)
    icon: mdi:sprinkler

automation:
  # --------------------------------------------------
  # Irrigation - Calculate Daily Runtime (ET-Based)
  # --------------------------------------------------
  - id: irrigation_calculate_runtime
    alias: "Irrigation - Calculate Zone Runtime"
    trigger:
      - platform: time
        at: "06:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.irrigation_system_enabled
        state: "on"
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.forecast_home_2
        data:
          type: daily
        response_variable: forecast_data
      - variables:
          temp: "{{ forecast_data['weather.forecast_home_2']['forecast'][0].temperature | float }}"
          humidity: "{{ forecast_data['weather.forecast_home_2']['forecast'][0].humidity | float }}"
          temp_factor: "{{ ((temp - 40) * 0.6 + 8) | float }}"
          humidity_modifier: "{{ (1.4 - (humidity / 100)) | float }}"
          raw_runtime: "{{ (temp_factor * humidity_modifier) | round | int }}"
          calculated_runtime: "{{ [[raw_runtime, 10] | max, 40] | min }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.irrigation_zone_runtime
        data:
          value: "{{ calculated_runtime }}"

  # --------------------------------------------------
  # Irrigation - Automatic Morning Cycle
  # --------------------------------------------------
  - id: irrigation_automatic_morning_cycle
    alias: "Irrigation - Automatic Morning Cycle"
    trigger:
      - platform: time
        at: "07:45:00"
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.forecast_home_2
        data:
          type: daily
        response_variable: forecast_data
      - variables:
          bad_conditions: "{{ ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy'] }}"
          current_weather: "{{ states('weather.forecast_home_2') }}"
          today_condition: "{{ forecast_data['weather.forecast_home_2']['forecast'][0].condition }}"
          tomorrow_condition: "{{ forecast_data['weather.forecast_home_2']['forecast'][1].condition }}"
          temperature: "{{ forecast_data['weather.forecast_home_2']['forecast'][0].temperature }}"
          humidity: "{{ forecast_data['weather.forecast_home_2']['forecast'][0].humidity }}"
          runtime: "{{ states('input_number.irrigation_zone_runtime') | int }}"
      - choose:
          # Branch 1 - System disabled, silent skip
          - conditions:
              - condition: state
                entity_id: input_boolean.irrigation_system_enabled
                state: "off"
            sequence: []

          # Branch 2 - Current weather is bad
          - conditions:
              - condition: template
                value_template: "{{ current_weather in bad_conditions }}"
            sequence:
              - service: notify.operational_log
                data:
                  title: "Irrigation - Cycle Skipped"
                  message: >
                    Reason: Currently {{ current_weather }}
                    Today's high: {{ temperature }}°F / {{ humidity }}% humidity
                    Today: {{ today_condition }}
                    Tomorrow: {{ tomorrow_condition }}
                    Time: {{ now().strftime('%I:%M %p') }}

          # Branch 3 - Bad weather forecast today or tomorrow
          - conditions:
              - condition: template
                value_template: >
                  {{ today_condition in bad_conditions or tomorrow_condition in bad_conditions }}
            sequence:
              - service: notify.operational_log
                data:
                  title: "Irrigation - Cycle Skipped"
                  message: >
                    Reason: {% if today_condition in bad_conditions %}Rainy forecast today{% else %}Rainy forecast tomorrow{% endif %}
                    Today's high: {{ temperature }}°F / {{ humidity }}% humidity
                    Today: {{ today_condition }}
                    Tomorrow: {{ tomorrow_condition }}
                    Time: {{ now().strftime('%I:%M %p') }}

        # Default - All clear, run the cycle
        default:
          - service: notify.operational_log
            data:
              title: "Irrigation - Automatic Cycle Started"
              message: >
                Runtime: {{ runtime }} minutes
                Today's high: {{ temperature }}°F / {{ humidity }}% humidity
                Today: {{ today_condition }}
                Tomorrow: {{ tomorrow_condition }}
                Time: {{ now().strftime('%I:%M %p') }}
          - service: switch.turn_on
            target:
              entity_id: switch.patio_drip_sprinkler
          - delay:
              minutes: "{{ runtime }}"
          - service: switch.turn_off
            target:
              entity_id: switch.patio_drip_sprinkler

  # --------------------------------------------------
  # Irrigation - Manual 30-Minute Run
  #
  # Triggered via app / dashboard button
  # --------------------------------------------------
  - id: irrigation_manual_30min_run
    alias: "Irrigation - Manual 30 Minute Run"
    trigger:
      - platform: state
        entity_id: input_button.irrigation_manual_30min
    condition:
      - condition: state
        entity_id: input_boolean.irrigation_system_enabled
        state: "on"
    action:
      - service: notify.house_notices
        data:
          title: "Irrigation - Manual Run Started"
          message: >
            Duration: 30 minutes
            Start Time: {{ now().strftime('%I:%M %p') }}
      - service: switch.turn_on
        target:
          entity_id: switch.patio_drip_sprinkler
      - delay: "00:30:00"
      - service: switch.turn_off
        target:
          entity_id: switch.patio_drip_sprinkler

  # --------------------------------------------------
  # Irrigation - Deadman Safety Off
  # --------------------------------------------------
  - id: irrigation_deadman_safety_off
    alias: "Irrigation - Deadman Safety Off"
    trigger:
      - platform: state
        entity_id: switch.patio_drip_sprinkler
        to: "on"
        for: "01:30:00"
    action:
      - service: notify.house_alerts
        data:
          title: "Irrigation - Deadman Safety Triggered"
          message: >
            Irrigation has been running for 90+ minutes!
            Forcing shutoff for safety.

            Check system for malfunction.
            Time: {{ now().strftime('%I:%M %p') }}
      - service: switch.turn_off
        target:
          entity_id: switch.patio_drip_sprinkler