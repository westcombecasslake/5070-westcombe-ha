# ==================================================
# Middle Bath Humidity Control
#
# Features:
#   - Relative rise detection, works year-round
#   - Rate-of-rise gate filters ambient drift from shower events
#   - 5-minute comfort delay before fan turns on
#   - Flat 30-minute runtime per HVAC guidelines
#   - 2-hour safety timeout (backstop only)
#   - Startup reset on HA restart
#   - Manual fan 30-minute auto-off
#   - HVAC exhaust boost after cycle
# ==================================================

input_number:
  middle_bath_humidity_baseline:
    name: Middle Bath Humidity Baseline
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  middle_bath_humidity_peak:
    name: Middle Bath Humidity Peak
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent-alert

  middle_bath_humidity_last_update:
    name: Middle Bath Humidity Last Update
    min: 0
    max: 9999999999
    step: 1
    mode: box

  middle_bath_fan_loop_start:
    name: Middle Bath Fan Loop Start
    min: 0
    max: 9999999999
    step: 1
    mode: box

automation:
  # --------------------------------------------------
  # Middle Bath Humidity - Shower Detection (Polling)
  # --------------------------------------------------
  - id: middle_bath_humidity_shower_detection
    alias: "Middle Bath Humidity - Shower Detection"
    trigger:
      - platform: time_pattern
        seconds: "/30"
    action:
      - variables:
          current_humidity: "{{ states('sensor.middle_bath_humidity') | float(0) }}"
          baseline: "{{ states('input_number.middle_bath_humidity_baseline') | float(0) }}"
          peak: "{{ states('input_number.middle_bath_humidity_peak') | float(0) }}"
          fan_state: "{{ states('fan.middle_bath_humidity') }}"
          loop_start: "{{ states('input_number.middle_bath_fan_loop_start') | float(0) }}"
          time_now: "{{ now().timestamp() }}"
          time_since_loop_start: "{{ (time_now - loop_start) if loop_start > 0 else 0 }}"
          last_reading_age: "{{ (time_now - as_timestamp(states.sensor.middle_bath_humidity.last_changed)) | float(0) }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_last_update
        data:
          value: "{{ time_now }}"

      - choose:
          # --------------------------------------------------
          # Case 1: Safety net only
          # Fires if Case 2 sequence is interrupted.
          # Forces fan off after 2-hour timeout.
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'on' and baseline > 0 }}"
            sequence:
              - condition: template
                value_template: "{{ time_since_loop_start >= 7200 }}"
              - service: fan.turn_off
                target:
                  entity_id: fan.middle_bath_humidity
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_humidity_baseline
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_humidity_peak
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_fan_loop_start
                data:
                  value: 0
              - service: notify.house_alerts
                data:
                  title: "Middle Bath Fan Safety Timeout"
                  message: >
                    Fan forced off after 2-hour timeout.
                    Check humidity sensor and automation.

          # --------------------------------------------------
          # Case 2: Full shower cycle
          # Detect → comfort delay → fan on → 30-min run
          # → fan off → reset → HVAC boost.
          #
          # Detection requires both:
          #   - Rise >= threshold (8% below 50%, 5% above 50%)
          #   - Last sensor reading within 15 minutes
          #     (filters slow ambient drift from hourly reports)
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'off' and baseline == 0 }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {% set threshold = 8 if current_humidity < 50 else 5 %}
                          {{ peak > 0
                             and (current_humidity - peak) >= threshold
                             and last_reading_age <= 900 }}
                    sequence:
                      # Lock baseline and peak at detection time
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.middle_bath_humidity_baseline
                        data:
                          value: "{{ peak | float(0) }}"
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.middle_bath_humidity_peak
                        data:
                          value: "{{ current_humidity | float(0) }}"
                      # Comfort delay — 5 minutes
                      - delay: "00:05:00"
                      # Record start time and turn fan on
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.middle_bath_fan_loop_start
                        data:
                          value: "{{ now().timestamp() }}"
                      - service: fan.turn_on
                        target:
                          entity_id: fan.middle_bath_humidity
                      # Run for 30 minutes then shut down
                      - delay: "00:30:00"
                      - service: fan.turn_off
                        target:
                          entity_id: fan.middle_bath_humidity
                      # Reset all tracking values
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.middle_bath_humidity_baseline
                        data:
                          value: 0
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.middle_bath_humidity_peak
                        data:
                          value: 0
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.middle_bath_fan_loop_start
                        data:
                          value: 0
                      # Coordinate with HVAC system
                      - service: script.hvac_exhaust_boost
                        data: {}

                default:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.middle_bath_humidity_peak
                    data:
                      value: "{{ current_humidity }}"

  # --------------------------------------------------
  # Middle Bath Humidity - Timeout Reset
  # --------------------------------------------------
  - id: middle_bath_humidity_timeout
    alias: "Middle Bath Humidity - Timeout"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: fan.middle_bath_humidity
        state: "off"
      - condition: template
        value_template: >
          {% set last_update = states('input_number.middle_bath_humidity_last_update') | float(0) %}
          {% set time_now = now().timestamp() %}
          {{ (time_now - last_update) > 900 }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_baseline
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_peak
        data:
          value: 0

  # --------------------------------------------------
  # Middle Bath Fan - Manual Timer
  # --------------------------------------------------
  - id: middle_bath_fan_manual_timer
    alias: "Middle Bath Fan - Manual Timer"
    trigger:
      - platform: state
        entity_id: fan.middle_bath_humidity
        to: "on"
    condition:
      - condition: template
        value_template: >
          {{ states('input_number.middle_bath_humidity_baseline') | float(0) == 0 }}
    action:
      - delay: "00:30:00"
      - service: fan.turn_off
        target:
          entity_id: fan.middle_bath_humidity

  # --------------------------------------------------
  # Middle Bath Humidity - Startup Reset
  # --------------------------------------------------
  - id: middle_bath_humidity_startup_reset
    alias: "Middle Bath Humidity - Startup Reset"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_baseline
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_peak
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_fan_loop_start
        data:
          value: 0
      - service: fan.turn_off
        target:
          entity_id: fan.middle_bath_humidity