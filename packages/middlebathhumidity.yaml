# ==================================================
# Middle Bath Humidity Control
#
# Automatic exhaust fan control based on relative humidity rise
# detection (shower events). Uses baseline tracking to work correctly
# regardless of seasonal outdoor humidity levels.
#
# This is an instance of the bathroom humidity control pattern
# (see also: masterbathhumidity.yaml). Each bathroom has its own
# helpers and entities to allow independent monitoring.
#
# Features:
#   - Detects showers by monitoring humidity rise patterns
#   - Relative rise method (baseline vs peak) works year-round
#   - Minimum 15-minute runtime after detection
#   - Continues until humidity drops to 25% of peak rise
#   - 2-hour safety timeout prevents infinite loops
#   - Manual fan activation includes 15-minute auto-off timer
#   - Coordinates with HVAC exhaust boost after fan cycle
#   - Confirmation lock prevents baseline drift during detection delay
# ==================================================

input_number:
  middle_bath_humidity_baseline:
    name: Middle Bath Humidity Baseline
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  middle_bath_humidity_peak:
    name: Middle Bath Humidity Peak
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent-alert

  middle_bath_humidity_last_update:
    name: Middle Bath Humidity Last Update
    min: 0
    max: 9999999999
    step: 1
    mode: box

  middle_bath_fan_loop_start:
    name: Middle Bath Fan Loop Start
    min: 0
    max: 9999999999
    step: 1
    mode: box

input_boolean:
  middle_bath_confirmation_pending:
    name: Middle Bath Confirmation Pending
    icon: mdi:timer-sand

automation:
  # --------------------------------------------------
  # Middle Bath Humidity - Shower Detection (Polling)
  #
  # Runs every 30 seconds to check humidity patterns.
  # Detects rising humidity, sets baseline, confirms with delay,
  # runs fan until humidity drops to acceptable level.
  #
  # Confirmation lock prevents baseline drift during 4-minute
  # detection delay by freezing peak value when threshold first met.
  # --------------------------------------------------
  - id: middle_bath_humidity_shower_detection
    alias: "Middle Bath Humidity - Shower Detection"
    trigger:
      - platform: time_pattern
        seconds: "/30"
    action:
      - variables:
          current_humidity: "{{ states('sensor.middle_bath_humidity') | float(0) }}"
          baseline: "{{ states('input_number.middle_bath_humidity_baseline') | float(0) }}"
          peak: "{{ states('input_number.middle_bath_humidity_peak') | float(0) }}"
          last_update: "{{ states('input_number.middle_bath_humidity_last_update') | float(0) }}"
          fan_state: "{{ states('fan.middle_bath_humidity') }}"
          loop_start: "{{ states('input_number.middle_bath_fan_loop_start') | float(0) }}"
          time_now: "{{ now().timestamp() }}"
          time_since_loop_start: "{{ (time_now - loop_start) if loop_start > 0 else 0 }}"
          confirmation_pending: "{{ is_state('input_boolean.middle_bath_confirmation_pending', 'on') }}"

      # Update last_update timestamp every cycle
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_last_update
        data:
          value: "{{ time_now }}"

      - choose:
          # --------------------------------------------------
          # Case 1: Fan is running - check if we should turn off
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'on' and baseline > 0 }}"
            sequence:
              # Safety timeout: 2 hours maximum runtime
              - condition: template
                value_template: "{{ time_since_loop_start < 7200 }}"

              # Calculate current rise and target threshold
              - variables:
                  peak_rise: "{{ peak - baseline }}"
                  current_rise: "{{ current_humidity - baseline }}"
                  target_rise: "{{ peak_rise * 0.25 }}"
                  elapsed_minutes: "{{ time_since_loop_start / 60 }}"

              # Turn off fan if:
              #   1. Minimum 15 minutes have passed, AND
              #   2. Current rise has dropped to 25% of peak rise
              - condition: template
                value_template: >
                  {{ elapsed_minutes >= 15 and current_rise <= target_rise }}

              - service: fan.turn_off
                target:
                  entity_id: fan.middle_bath_humidity

              # Reset tracking values
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_humidity_baseline
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_humidity_peak
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_fan_loop_start
                data:
                  value: 0
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.middle_bath_confirmation_pending

              # Coordinate with HVAC system
              - service: script.hvac_exhaust_boost
                data: {}

          # --------------------------------------------------
          # Case 2: Safety timeout exceeded - force fan off
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'on' and time_since_loop_start >= 7200 }}"
            sequence:
              - service: fan.turn_off
                target:
                  entity_id: fan.middle_bath_humidity

              # Reset all tracking
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_humidity_baseline
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_humidity_peak
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.middle_bath_fan_loop_start
                data:
                  value: 0
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.middle_bath_confirmation_pending

              - service: notify.house_alerts
                data:
                  title: "Middle Bath Fan Safety Timeout"
                  message: >
                    Fan forced off after 2-hour timeout.
                    Check humidity sensor and automation logic.

          # --------------------------------------------------
          # Case 3: Detecting shower - monitor for rising humidity
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'off' and baseline == 0 }}"
            sequence:
              - choose:
                  # Sub-case: Rising humidity detected - START confirmation
                  - conditions:
                      - condition: template
                        value_template: >
                          {% set threshold = 8 if current_humidity < 50 else 5 %}
                          {{ peak > 0 and (current_humidity - peak) >= threshold }}
                      - condition: state
                        entity_id: input_boolean.middle_bath_confirmation_pending
                        state: "off"
                    sequence:
                      # Lock confirmation state
                      - service: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.middle_bath_confirmation_pending

                      # 4-minute delay to confirm sustained rise (actual shower)
                      - delay: "00:04:00"

                      # Re-check humidity after delay
                      - variables:
                          confirmed_humidity: "{{ states('sensor.middle_bath_humidity') | float(0) }}"
                          locked_peak: "{{ states('input_number.middle_bath_humidity_peak') | float(0) }}"

                      # If rise still present, start fan - otherwise clean up lock
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: >
                                  {% set threshold = 8 if confirmed_humidity < 50 else 5 %}
                                  {{ (confirmed_humidity - locked_peak) >= threshold }}
                            sequence:
                              # Set baseline to the locked peak value (original starting point)
                              - service: input_number.set_value
                                target:
                                  entity_id: input_number.middle_bath_humidity_baseline
                                data:
                                  value: "{{ locked_peak }}"

                              # Update peak to current (confirmed) humidity
                              - service: input_number.set_value
                                target:
                                  entity_id: input_number.middle_bath_humidity_peak
                                data:
                                  value: "{{ confirmed_humidity }}"

                              # Start loop timer (use now() not pre-delay time_now)
                              - service: input_number.set_value
                                target:
                                  entity_id: input_number.middle_bath_fan_loop_start
                                data:
                                  value: "{{ now().timestamp() }}"

                              # Turn on fan
                              - service: fan.turn_on
                                target:
                                  entity_id: fan.middle_bath_humidity

                              # Clear confirmation lock
                              - service: input_boolean.turn_off
                                target:
                                  entity_id: input_boolean.middle_bath_confirmation_pending

                        # Clear confirmation lock if humidity dropped during delay
                        default:
                          - service: input_boolean.turn_off
                            target:
                              entity_id: input_boolean.middle_bath_confirmation_pending

                # Default: Update peak if NOT in confirmation period
                default:
                  - condition: state
                    entity_id: input_boolean.middle_bath_confirmation_pending
                    state: "off"

                  - service: input_number.set_value
                    target:
                      entity_id: input_number.middle_bath_humidity_peak
                    data:
                      value: "{{ current_humidity }}"

  # --------------------------------------------------
  # Middle Bath Humidity - Timeout Reset
  #
  # If humidity hasn't changed in 15 minutes and fan is off,
  # reset baseline/peak to prevent stale values from triggering
  # false detection.
  # --------------------------------------------------
  - id: middle_bath_humidity_timeout
    alias: "Middle Bath Humidity - Timeout"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: fan.middle_bath_humidity
        state: "off"
      - condition: template
        value_template: >
          {% set last_update = states('input_number.middle_bath_humidity_last_update') | float(0) %}
          {% set time_now = now().timestamp() %}
          {{ (time_now - last_update) > 900 }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_baseline
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.middle_bath_humidity_peak
        data:
          value: 0
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.middle_bath_confirmation_pending

  # --------------------------------------------------
  # Middle Bath Fan - Manual Timer
  #
  # If fan is manually turned on (not by automation),
  # automatically turn it off after 15 minutes.
  # Independent of humidity-based control.
  # --------------------------------------------------
  - id: middle_bath_fan_manual_timer
    alias: "Middle Bath Fan - Manual Timer"
    trigger:
      - platform: state
        entity_id: fan.middle_bath_humidity
        to: "on"
    condition:
      # Only trigger if baseline is 0 (not triggered by automation)
      - condition: template
        value_template: >
          {{ states('input_number.middle_bath_humidity_baseline') | float(0) == 0 }}
    action:
      - delay: "00:15:00"
      - service: fan.turn_off
        target:
          entity_id: fan.middle_bath_humidity