###############################################################################
# AIR QUALITY MONITORING & CONTROL
#
# Comprehensive air quality management using IKEA Alpstuga sensors to monitor
# CO2 and PM2.5 levels across two floors. Coordinates HVAC filtration and
# exhaust ventilation to maintain healthy indoor air quality.
#
# ARCHITECTURE:
# Two independent control loops share the HVAC fan resource:
#   1. PM2.5 loop — runs HVAC fan in continuous ON mode for filtration
#   2. CO2 loop — runs exhaust fans to flush stale air via ventilation
#
# PM2.5 takes strict priority. The CO2 automations check
# input_boolean.pm25_filtration_active before acting, and any automation
# that returns the HVAC fan to AUTO must also check this flag.
#
# FEATURES:
#   - PM2.5 filtration takes priority over all other HVAC fan automation
#   - CO2 managed via exhaust ventilation when PM2.5 levels allow
#   - Daily air quality summaries with 7-day trend comparison
#   - Sensor offline detection with recovery notification
#   - Four-tier Pushover notification system (emergency / alert / notice / log)
#
# HARDWARE:
#   - 2x IKEA Alpstuga sensors (CO2, PM2.5)
#       Floor 1: Living area   (sensor.living_area_co2, sensor.living_area_pm25)
#       Floor 2: Master bedroom (sensor.master_bedroom_co2, sensor.master_bedroom_pm25)
#   - HVAC fan with HEPA 13 + carbon filter (climate.main_floor via script)
#   - Exhaust fans: bathroom, laundry, kitchen hood
#
# THRESHOLDS — PM2.5 μg/m³ (EPA/WHO):
#   Good:                    0–12
#   Moderate:               12–35
#   Unhealthy for sensitive: 35–55
#   Unhealthy:              55–150
#   Very unhealthy:        150–250
#   Hazardous:              250+
#
# THRESHOLDS — CO2 ppm:
#   Excellent:    <800
#   Good:       800–1000
#   Acceptable: 1000–1500
#   Poor:       1500–2000
#   Very poor:   >2000
#
# INTEGRATION NOTE:
# Any automation outside this package that controls the HVAC fan must check
# input_boolean.pm25_filtration_active before returning it to AUTO mode.
# PM2.5 filtration overrides bathroom and laundry fan automations.
###############################################################################

# ==================================================
# Helper Entities
# ==================================================

input_boolean:
  pm25_filtration_active:
    name: PM2.5 Filtration Active
    icon: mdi:air-filter

input_text:
  pm25_status:
    name: "PM2.5 Status"
    initial: "Normal"

input_number:
  # --------------------------------------------------
  # Daily maximums — reset at 11:55 PM by daily summary
  # --------------------------------------------------
  living_area_co2_max_today:
    name: Living Area CO2 Max Today
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2

  living_area_pm25_max_today:
    name: Living Area PM2.5 Max Today
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "μg/m³"
    icon: mdi:air-filter

  master_bedroom_co2_max_today:
    name: Master Bedroom CO2 Max Today
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2

  master_bedroom_pm25_max_today:
    name: Master Bedroom PM2.5 Max Today
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "μg/m³"
    icon: mdi:air-filter

  # --------------------------------------------------
  # PM2.5 filtration session tracking
  # --------------------------------------------------
  pm25_filter_events_today:
    name: PM2.5 Filter Events Today
    min: 0
    max: 100
    step: 1
    icon: mdi:counter

  pm25_filtration_start_time:
    name: PM2.5 Filtration Start Time
    min: 0
    max: 9999999999
    step: 1
    mode: box

  pm25_filtration_runtime_today:
    name: PM2.5 Filtration Runtime Today
    min: 0
    max: 1440
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer

  # --------------------------------------------------
  # 7-day rolling averages — updated nightly by daily summary
  # Used for trend comparison in the summary report
  # --------------------------------------------------
  pm25_filter_events_7day_avg:
    name: PM2.5 Filter Events 7-Day Average
    min: 0
    max: 100
    step: 0.1
    icon: mdi:chart-line

  living_area_co2_7day_avg:
    name: Living Area CO2 7-Day Average
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "ppm"
    icon: mdi:chart-line

  living_area_pm25_7day_avg:
    name: Living Area PM2.5 7-Day Average
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "μg/m³"
    icon: mdi:chart-line

  master_bedroom_co2_7day_avg:
    name: Master Bedroom CO2 7-Day Average
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "ppm"
    icon: mdi:chart-line

  master_bedroom_pm25_7day_avg:
    name: Master Bedroom PM2.5 7-Day Average
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "μg/m³"
    icon: mdi:chart-line

# ==================================================
# PM2.5 Management (HIGHEST PRIORITY)
#
# Three automations manage the full PM2.5 filtration lifecycle:
#   Elevated      — detects threshold breach, activates HVAC fan, notifies
#   Filter Continue — polling guard that keeps fan on while PM2.5 stays high
#   Normal        — detects recovery, deactivates flag, returns fan to AUTO
#   Safety Timeout — hard 4-hour limit in case sensor gets stuck elevated
#
# Notification severity scales with measured level:
#   >150 μg/m³  → house_alerts  (emergency)
#    >55 μg/m³  → house_alerts  (alert)
#    >35 μg/m³  → house_notices (standard)
# ==================================================

automation:
  # --------------------------------------------------
  # PM2.5 — Elevated Detection
  #
  # Watches both sensors. Triggers after 3 minutes above
  # 35 μg/m³ (unhealthy for sensitive groups) to filter
  # brief spikes from cooking or other transient events.
  #
  # On trigger:
  #   - Sets pm25_filtration_active flag (blocks CO2 ventilation)
  #   - Records start timestamp for runtime calculation
  #   - Switches HVAC fan from AUTO to continuous ON
  #   - Sends severity-appropriate notification
  # --------------------------------------------------
  - id: air_quality_pm25_elevated
    alias: "Air Quality - PM2.5 Elevated"
    trigger:
      - platform: numeric_state
        entity_id: sensor.living_area_pm25
        above: 35
        for: "00:03:00"
      - platform: numeric_state
        entity_id: sensor.master_bedroom_pm25
        above: 35
        for: "00:03:00"
    condition:
      - condition: state
        entity_id: input_boolean.pm25_filtration_active
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.pm25_filtration_active

      - service: input_text.set_value
        target:
          entity_id: input_text.pm25_status
        data:
          value: >
            Active - {{ [states('sensor.living_area_pm25')|float(0), states('sensor.master_bedroom_pm25')|float(0)] | max | round(1) }} μg/m³

      # Record start time for runtime accounting in Normal and Safety Timeout
      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filtration_start_time
        data:
          value: "{{ as_timestamp(now()) }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filter_events_today
        data:
          value: "{{ states('input_number.pm25_filter_events_today') | int(0) + 1 }}"

      - service: climate.set_fan_mode
        target:
          device_id: c38113c2d02da790b689d4a3bdc4b5e1
        data:
          fan_mode: "on"

      # Scale notification to worst measured level across both sensors
      - choose:
          - conditions:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.living_area_pm25
                    above: 150
                  - condition: numeric_state
                    entity_id: sensor.master_bedroom_pm25
                    above: 150
            sequence:
              - service: notify.house_alerts
                data:
                  title: "⚠️ AIR QUALITY EMERGENCY"
                  message: |
                    PM2.5: {{ [states('sensor.living_area_pm25')|float(0), states('sensor.master_bedroom_pm25')|float(0)] | max }} μg/m³ (VERY UNHEALTHY)
                    Floor 1: {{ states('sensor.living_area_pm25') }} μg/m³
                    Floor 2: {{ states('sensor.master_bedroom_pm25') }} μg/m³
                    
                    ACTIONS REQUIRED:
                    1. Close all windows/doors
                    2. HVAC filter running
                    3. Stay indoors
                    4. Check air quality source

          - conditions:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.living_area_pm25
                    above: 55
                  - condition: numeric_state
                    entity_id: sensor.master_bedroom_pm25
                    above: 55
            sequence:
              - service: notify.house_alerts
                data:
                  title: "⚠️ AIR QUALITY ALERT"
                  message: |
                    PM2.5: {{ [states('sensor.living_area_pm25')|float(0), states('sensor.master_bedroom_pm25')|float(0)] | max }} μg/m³ (UNHEALTHY)
                    Floor 1: {{ states('sensor.living_area_pm25') }} μg/m³
                    Floor 2: {{ states('sensor.master_bedroom_pm25') }} μg/m³
                    
                    HVAC filter activated
                    Avoid outdoor air intake
        default:
          - service: notify.house_notices
            data:
              title: "💨 Air Quality Alert"
              message: |
                PM2.5 elevated: {{ [states('sensor.living_area_pm25')|float(0), states('sensor.master_bedroom_pm25')|float(0)] | max }} μg/m³
                Floor 1: {{ states('sensor.living_area_pm25') }} μg/m³
                Floor 2: {{ states('sensor.master_bedroom_pm25') }} μg/m³
                Threshold: Unhealthy for sensitive groups
                
                HVAC filter activated
                Monitor air quality

  # --------------------------------------------------
  # PM2.5 — Filtration Continuation
  #
  # Polling guard that runs every 10 minutes while
  # pm25_filtration_active is on. Re-asserts the HVAC fan
  # ON command in case another automation or manual action
  # returned it to AUTO while filtration is still needed.
  #
  # Condition: either sensor still above 12 μg/m³ (Good threshold).
  # If both sensors are below 12, Normal handles the shutdown.
  # --------------------------------------------------
  - id: air_quality_pm25_filter_continue
    alias: "Air Quality - PM2.5 Filter Continue"
    trigger:
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: state
        entity_id: input_boolean.pm25_filtration_active
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: sensor.living_area_pm25
            above: 12
          - condition: numeric_state
            entity_id: sensor.master_bedroom_pm25
            above: 12
    action:
      - service: climate.set_fan_mode
        target:
          device_id: c38113c2d02da790b689d4a3bdc4b5e1
        data:
          fan_mode: "on"

  # --------------------------------------------------
  # PM2.5 — Return to Normal
  #
  # Polls every 10 minutes. Shuts down filtration when
  # both sensors report Good air quality (<12 μg/m³) and
  # at least 15 minutes of filtration have elapsed.
  #
  # The 15-minute minimum prevents premature shutdown
  # from a brief sensor dip before air is fully cleared.
  #
  # On recovery:
  #   - Calculates and logs actual runtime
  #   - Clears pm25_filtration_active flag
  #   - Returns HVAC fan to AUTO
  # --------------------------------------------------
  - id: air_quality_pm25_normal
    alias: "Air Quality - PM2.5 Normal"
    trigger:
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: state
        entity_id: input_boolean.pm25_filtration_active
        state: "on"
      - condition: numeric_state
        entity_id: sensor.living_area_pm25
        below: 12
      - condition: numeric_state
        entity_id: sensor.master_bedroom_pm25
        below: 12
      - condition: template
        value_template: "{{ (as_timestamp(now()) - states('input_number.pm25_filtration_start_time')|float(0)) > 900 }}"
    action:
      - variables:
          runtime_minutes: "{{ ((as_timestamp(now()) - states('input_number.pm25_filtration_start_time')|float(0)) / 60) | round(0) }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filtration_runtime_today
        data:
          value: "{{ states('input_number.pm25_filtration_runtime_today')|int(0) + runtime_minutes|int(0) }}"

      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.pm25_filtration_active

      - service: input_text.set_value
        target:
          entity_id: input_text.pm25_status
        data:
          value: "Normal"

      - service: climate.set_fan_mode
        target:
          device_id: c38113c2d02da790b689d4a3bdc4b5e1
        data:
          fan_mode: "auto"

      - service: notify.operational_log
        data:
          title: "✅ Air Quality Normal"
          message: |
            Floor 1: {{ states('sensor.living_area_co2') }} ppm CO2, {{ states('sensor.living_area_pm25') }} μg/m³ PM2.5
            Floor 2: {{ states('sensor.master_bedroom_co2') }} ppm CO2, {{ states('sensor.master_bedroom_pm25') }} μg/m³ PM2.5
            
            HVAC filter returned to AUTO
            Filtration duration: {{ runtime_minutes }} minutes

  # --------------------------------------------------
  # PM2.5 — Safety Timeout
  #
  # Hard 4-hour limit on continuous filtration. Fires if
  # Normal never triggers, which would indicate a stuck
  # sensor reporting permanently elevated PM2.5.
  #
  # Logs actual elapsed runtime rather than assuming 4 hours,
  # since HA may have restarted during the filtration window.
  # --------------------------------------------------
  - id: air_quality_pm25_safety_timeout
    alias: "Air Quality - PM2.5 Safety Timeout"
    trigger:
      - platform: state
        entity_id: input_boolean.pm25_filtration_active
        to: "on"
        for: "04:00:00"
    action:
      # Calculate actual elapsed time rather than assuming 4 hours
      - variables:
          runtime_minutes: "{{ ((as_timestamp(now()) - states('input_number.pm25_filtration_start_time')|float(0)) / 60) | round(0) }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filtration_runtime_today
        data:
          value: "{{ states('input_number.pm25_filtration_runtime_today')|int(0) + runtime_minutes|int(0) }}"

      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.pm25_filtration_active

      - service: input_text.set_value
        target:
          entity_id: input_text.pm25_status
        data:
          value: "Normal"

      - service: climate.set_fan_mode
        target:
          device_id: c38113c2d02da790b689d4a3bdc4b5e1
        data:
          fan_mode: "auto"

      - service: notify.house_notices
        data:
          title: "⚠️ PM2.5 Filtration Timeout"
          message: |
            4-hour filtration limit reached
            Runtime logged: {{ runtime_minutes }} minutes
            Current levels:
            Floor 1: {{ states('sensor.living_area_pm25') }} μg/m³
            Floor 2: {{ states('sensor.master_bedroom_pm25') }} μg/m³
            
            Check sensors and air quality source

# ==================================================
# CO2 Management
#
# CO2 is controlled via exhaust ventilation rather than
# filtration — the HEPA/carbon filter does not scrub CO2.
# These automations run exhaust fans to flush stale air
# and notify the resident to open windows if needed.
#
# All CO2 automations are gated on pm25_filtration_active
# being off. Running exhaust fans during PM2.5 filtration
# would draw unfiltered outdoor air into the house.
# ==================================================

  # --------------------------------------------------
  # CO2 — Critical Level (Emergency)
  #
  # Immediate alert when either sensor exceeds 2000 ppm
  # (Very Poor — potential cognitive impairment).
  # Sustained for 5 minutes to filter brief sensor spikes.
  #
  # No ventilation action taken at this level — resident
  # must manually open windows. Alert directs them to act.
  # --------------------------------------------------
  - id: air_quality_co2_critical
    alias: "Air Quality - CO2 Critical"
    trigger:
      - platform: numeric_state
        entity_id: sensor.living_area_co2
        above: 2000
        for: "00:05:00"
      - platform: numeric_state
        entity_id: sensor.master_bedroom_co2
        above: 2000
        for: "00:05:00"
    action:
      - service: notify.house_alerts
        data:
          title: "⚠️ CO2 CRITICAL"
          message: |
            CO2: {{ trigger.to_state.state }} ppm
            Location: {{ trigger.to_state.attributes.friendly_name }}
            Time: {{ now().strftime('%I:%M %p') }}
            
            OPEN WINDOWS IMMEDIATELY
            Consider evacuating room

  # --------------------------------------------------
  # CO2 — High Level Living Area
  #
  # Triggers at 1000 ppm (Acceptable/Poor boundary) sustained
  # for 5 minutes. Runs HVAC exhaust boost script and notifies
  # resident with severity-based window guidance.
  #
  # Gated on pm25_filtration_active being off — exhaust fans
  # draw outdoor air in, which is counterproductive during
  # PM2.5 filtration events.
  # --------------------------------------------------
  - id: air_quality_co2_high_living_area
    alias: "Air Quality - CO2 High Living Area"
    trigger:
      - platform: numeric_state
        entity_id: sensor.living_area_co2
        above: 1000
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_boolean.pm25_filtration_active
        state: "off"
    action:
      - service: script.hvac_exhaust_boost
      - service: notify.house_notices
        data:
          title: "🪟 Open Windows - CO2 Elevated"
          message: |
            CO2: {{ states('sensor.living_area_co2') }} ppm
            {% set co2 = states('sensor.living_area_co2')|int(0) %}
            {% if co2 > 1500 %}Level: Poor - open doors and windows
            {% else %}Level: Moderate - open a window
            {% endif %}
            Outdoor temp: {{ states('sensor.ecobee_outdoor_temperature') }}°F
            HVAC exhaust boost running (20 min)

  # --------------------------------------------------
  # CO2 — High Level Master Bedroom
  #
  # Same threshold as living area (1000 ppm, 5 minutes)
  # but restricted to nighttime hours (9 PM–7 AM) when
  # the bedroom is occupied. Daytime CO2 rise in an
  # unoccupied bedroom is not actionable.
  #
  # Uses master bath fan rather than HVAC exhaust boost —
  # direct extraction from the bedroom zone is more
  # effective for overnight CO2 accumulation.
  # --------------------------------------------------
  - id: air_quality_co2_high_master_bedroom
    alias: "Air Quality - CO2 High Master Bedroom"
    trigger:
      - platform: numeric_state
        entity_id: sensor.master_bedroom_co2
        above: 1000
        for: "00:05:00"
    condition:
      # Only act during occupied hours
      - condition: time
        after: "21:00:00"
        before: "07:00:00"
      # Exhaust during PM2.5 filtration draws in unfiltered outdoor air
      - condition: state
        entity_id: input_boolean.pm25_filtration_active
        state: "off"
    action:
      - service: light.turn_on
        target:
          entity_id: light.master_bath_fan

      # Fixed 20-minute runtime — no return-to-normal polling for this zone
      - delay: "00:20:00"

      - service: light.turn_off
        target:
          entity_id: light.master_bath_fan

      - service: notify.house_notices
        data:
          title: "🪟 Bedroom CO2 High"
          message: |
            CO2: {{ states('sensor.master_bedroom_co2') }} ppm
            Time: {{ now().strftime('%I:%M %p') }}
            
            Master bath fan running (20 min)
            Consider opening window

# ==================================================
# Daily Statistics & Reporting
#
# Two automations handle statistics:
#   Update Daily Max — polls every 5 minutes, tracks
#     the highest reading seen today for each sensor.
#   Daily Summary — fires at 11:55 PM, sends a formatted
#     report comparing today's peaks to 7-day averages,
#     updates rolling averages, and resets daily counters.
# ==================================================

  # --------------------------------------------------
  # Daily Stats — Update Max Values
  #
  # Polls every 5 minutes and updates each sensor's daily
  # max if the current reading exceeds the stored value.
  # Uses choose/condition rather than max() template to
  # avoid overwriting a valid peak with a sensor dropout.
  # --------------------------------------------------
  - id: air_quality_update_daily_max
    alias: "Air Quality - Update Daily Max"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.living_area_co2')|float(0) > states('input_number.living_area_co2_max_today')|float(0) }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.living_area_co2_max_today
                data:
                  value: "{{ states('sensor.living_area_co2')|float(0) }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.living_area_pm25')|float(0) > states('input_number.living_area_pm25_max_today')|float(0) }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.living_area_pm25_max_today
                data:
                  value: "{{ states('sensor.living_area_pm25')|float(0) }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.master_bedroom_co2')|float(0) > states('input_number.master_bedroom_co2_max_today')|float(0) }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.master_bedroom_co2_max_today
                data:
                  value: "{{ states('sensor.master_bedroom_co2')|float(0) }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.master_bedroom_pm25')|float(0) > states('input_number.master_bedroom_pm25_max_today')|float(0) }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.master_bedroom_pm25_max_today
                data:
                  value: "{{ states('sensor.master_bedroom_pm25')|float(0) }}"

  # --------------------------------------------------
  # Daily Summary Report — 11:55 PM
  #
  # Compares today's peak readings to 7-day rolling averages
  # and sends a formatted summary via operational_log.
  # Trend arrows show whether today was better or worse
  # than the rolling average by a meaningful margin.
  #
  # After sending the report:
  #   1. Updates all 7-day averages with today's values
  #      using weighted average: ((avg * 6) + today) / 7
  #   2. Resets all daily counters to zero
  # --------------------------------------------------
  - id: air_quality_daily_summary
    alias: "Air Quality - Daily Summary"
    trigger:
      - platform: time
        at: "23:55:00"
    action:
      - variables:
          floor1_co2: "{{ states('input_number.living_area_co2_max_today')|float(0) }}"
          floor1_pm25: "{{ states('input_number.living_area_pm25_max_today')|float(0) }}"
          floor1_co2_avg: "{{ states('input_number.living_area_co2_7day_avg')|float(0) }}"
          floor1_pm25_avg: "{{ states('input_number.living_area_pm25_7day_avg')|float(0) }}"

          floor2_co2: "{{ states('input_number.master_bedroom_co2_max_today')|float(0) }}"
          floor2_pm25: "{{ states('input_number.master_bedroom_pm25_max_today')|float(0) }}"
          floor2_co2_avg: "{{ states('input_number.master_bedroom_co2_7day_avg')|float(0) }}"
          floor2_pm25_avg: "{{ states('input_number.master_bedroom_pm25_7day_avg')|float(0) }}"

          # Status emoji reflects the worst reading of the day (CO2 or PM2.5)
          floor1_emoji: >
            {% if floor1_co2 > 2000 or floor1_pm25 > 55 %}🔴
            {% elif floor1_co2 > 1200 or floor1_pm25 > 35 %}🟡
            {% else %}🟢{% endif %}

          floor2_emoji: >
            {% if floor2_co2 > 2000 or floor2_pm25 > 55 %}🔴
            {% elif floor2_co2 > 1200 or floor2_pm25 > 35 %}🟡
            {% else %}🟢{% endif %}

          # CO2 trend: flag if >100 ppm above or below 7-day average
          floor1_co2_diff: "{{ (floor1_co2 - floor1_co2_avg)|round(0) }}"
          floor1_co2_trend: >
            {% set diff = floor1_co2 - floor1_co2_avg %}
            {% if diff > 100 %}↑ {{ diff|round(0) }} ppm vs avg
            {% elif diff < -100 %}↓ {{ (diff|abs)|round(0) }} ppm vs avg
            {% else %}→ stable{% endif %}

          # PM2.5 trend: flag if >10 μg/m³ above or below 7-day average
          floor1_pm25_diff: "{{ (floor1_pm25 - floor1_pm25_avg)|round(1) }}"
          floor1_pm25_trend: >
            {% set diff = floor1_pm25 - floor1_pm25_avg %}
            {% if diff > 10 %}↑ worse
            {% elif diff < -10 %}↓ better
            {% else %}→ stable{% endif %}

          floor2_co2_diff: "{{ (floor2_co2 - floor2_co2_avg)|round(0) }}"
          floor2_co2_trend: >
            {% set diff = floor2_co2 - floor2_co2_avg %}
            {% if diff > 100 %}↑ {{ diff|round(0) }} ppm vs avg
            {% elif diff < -100 %}↓ {{ (diff|abs)|round(0) }} ppm vs avg
            {% else %}→ stable{% endif %}

          floor2_pm25_diff: "{{ (floor2_pm25 - floor2_pm25_avg)|round(1) }}"
          floor2_pm25_trend: >
            {% set diff = floor2_pm25 - floor2_pm25_avg %}
            {% if diff > 10 %}↑ worse
            {% elif diff < -10 %}↓ better
            {% else %}→ stable{% endif %}

          events_today: "{{ states('input_number.pm25_filter_events_today')|int(0) }}"
          runtime_today: "{{ states('input_number.pm25_filtration_runtime_today')|int(0) }}"
          events_7day_avg: "{{ states('input_number.pm25_filter_events_7day_avg')|float(0) }}"

          # Filtration event trend: flag if >1.5 events above or below average
          event_diff: "{{ events_today|int(0) - events_7day_avg|float(0) }}"
          trend_text: >
            {% if event_diff|float > 1.5 %}+{{ event_diff|round(0) }} events vs 7-day avg (worse)
            {% elif event_diff|float < -1.5 %}{{ event_diff|round(0) }} events vs 7-day avg (better)
            {% else %}Same as 7-day avg{% endif %}

          # Summary status line — surfaces the most actionable condition
          status_msg: >
            {% if floor1_emoji == '🔴' or floor2_emoji == '🔴' %}
            ⚠️ Poor air quality. {% if floor1_co2 > 2000 %}Living area CO2 critical. {% endif %}{% if floor2_co2 > 2000 %}Bedroom CO2 critical. {% endif %}{% if floor1_pm25 > 55 or floor2_pm25 > 55 %}Check HVAC filter and ventilation.{% endif %}
            {% elif floor1_emoji == '🟡' or floor2_emoji == '🟡' %}
            {% if floor1_co2 > 1200 or floor2_co2 > 1200 %}CO2 elevated during occupied periods. {% endif %}{% if floor1_pm25 > 35 or floor2_pm25 > 35 %}PM2.5 spike from cooking/activity. {% endif %}
            {% else %}
            ✓ {% if floor2_co2 > 1000 and floor2_co2 <= 1200 %}Bedroom CO2 elevated overnight (normal). {% else %}Excellent air quality all day{% endif %}
            {% endif %}

      - service: notify.operational_log
        data:
          title: "📊 Daily Air Quality"
          message: |
            {{ floor1_emoji }} Floor 1 CO2: {{ floor1_co2|round(0) }} ppm max ({{ floor1_co2_trend }})
                       PM2.5: {{ floor1_pm25|round(1) }} μg/m³ max ({{ floor1_pm25_trend }})
            {{ floor2_emoji }} Floor 2 CO2: {{ floor2_co2|round(0) }} ppm max ({{ floor2_co2_trend }})
                       PM2.5: {{ floor2_pm25|round(1) }} μg/m³ max ({{ floor2_pm25_trend }})
            
            PM2.5 filtration: {{ events_today }} events, {{ runtime_today }} min runtime
            Trend: {{ trend_text }}
            
            {{ status_msg }}

      # Update 7-day rolling averages — weighted: ((avg * 6) + today) / 7
      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filter_events_7day_avg
        data:
          value: "{{ ((events_7day_avg|float(0) * 6) + events_today|int(0)) / 7 }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.living_area_co2_7day_avg
        data:
          value: "{{ ((floor1_co2_avg * 6) + floor1_co2) / 7 }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.living_area_pm25_7day_avg
        data:
          value: "{{ ((floor1_pm25_avg * 6) + floor1_pm25) / 7 }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.master_bedroom_co2_7day_avg
        data:
          value: "{{ ((floor2_co2_avg * 6) + floor2_co2) / 7 }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.master_bedroom_pm25_7day_avg
        data:
          value: "{{ ((floor2_pm25_avg * 6) + floor2_pm25) / 7 }}"

      # Reset daily counters for the next day
      - service: input_number.set_value
        target:
          entity_id: input_number.living_area_co2_max_today
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.living_area_pm25_max_today
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.master_bedroom_co2_max_today
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.master_bedroom_pm25_max_today
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filter_events_today
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.pm25_filtration_runtime_today
        data:
          value: 0

# ==================================================
# Sensor Monitoring
#
# Detects sensors going offline and logs recovery.
# Offline detection has a 10-minute grace period to
# avoid alerts from brief Zigbee dropouts or restarts.
# ==================================================

  # --------------------------------------------------
  # Sensor Offline Detection
  #
  # Watches all four sensors. Triggers if any reports
  # unavailable for 10 consecutive minutes. A single
  # automation covers all sensors — trigger context
  # provides the specific sensor name in the notification.
  # --------------------------------------------------
  - id: air_quality_sensor_offline_alert
    alias: "Air Quality - Sensor Offline Alert"
    trigger:
      - platform: state
        entity_id:
          - sensor.living_area_co2
          - sensor.living_area_pm25
          - sensor.master_bedroom_co2
          - sensor.master_bedroom_pm25
        to: "unavailable"
        for: "00:10:00"
    action:
      - service: notify.house_notices
        data:
          title: "⚠️ Air Quality Sensor Offline"
          message: |
            Sensor: {{ trigger.to_state.attributes.friendly_name }}
            Offline since: {{ now().strftime('%I:%M %p') }}
            Duration: 10+ minutes
            
            Check sensor battery/connection
            Air quality monitoring impaired

  # --------------------------------------------------
  # Sensor Recovery Notification
  #
  # Fires when a sensor returns from unavailable.
  # 2-minute stability delay filters brief reconnects
  # that drop out again immediately.
  # --------------------------------------------------
  - id: air_quality_sensor_recovery
    alias: "Air Quality - Sensor Recovery"
    trigger:
      - platform: state
        entity_id:
          - sensor.living_area_co2
          - sensor.living_area_pm25
          - sensor.master_bedroom_co2
          - sensor.master_bedroom_pm25
        from: "unavailable"
        for: "00:02:00"
    action:
      - service: notify.operational_log
        data:
          title: "✅ Air Quality Sensor Recovered"
          message: |
            Sensor: {{ trigger.to_state.attributes.friendly_name }}
            Status: Online
            Current reading: {{ trigger.to_state.state }} {{ trigger.to_state.attributes.unit_of_measurement }}