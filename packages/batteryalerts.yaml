###############################################################################
# BATTERY MONITORING PACKAGE
###############################################################################
# Place this file in: /config/packages/batteryalerts.yaml
#
# Monitors battery levels and sends tiered alerts
# Provides helper for Android Auto status display
#
# Changes from v1:
#   - Added unavailable detection per sensor — notifies with device name
#   - Fixed battery_status_report to include unavailable sensors
#   - Fixed update_battery_status to reflect unavailable sensors
#   - Daily trigger moved to 23:55 (end of day with other reports)
###############################################################################

# --------------------------------------------------
# Battery Status Helper (visible to all YAML files)
# --------------------------------------------------
input_text:
  battery_status:
    name: "Battery Status"
    initial: "Normal"

# --------------------------------------------------
# Scripts
# --------------------------------------------------
script:
  battery_status_report:
    alias: "Battery Status Report"
    sequence:
      - action: notify.battery_alerts
        data:
          title: "Battery Status Report"
          message: >
            {% set ns = namespace(msg='') %}
            {% for state in states.sensor %}
              {% if '_battery' in state.entity_id %}
                {% if state.state == 'unavailable' %}
                  {% set ns.msg = ns.msg + state.attributes.friendly_name + ': Unavailable\n' %}
                {% elif state.state | int(0) <= 30 and state.state | int(0) > 0 %}
                  {% set ns.msg = ns.msg + state.attributes.friendly_name + ': ' + state.state + '%\n' %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if ns.msg == '' %}All batteries above 30% and online{% else %}{{ ns.msg }}{% endif %}

  update_battery_status:
    alias: "Update Battery Status"
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.battery_status
        data:
          value: >
            {% set battery_sensors = [
              'sensor.back_yard_garage_battery',
              'sensor.front_door_battery',
              'sensor.basement_humidity_sensor_battery',
              'sensor.basement_smoke_co_battery',
              'sensor.south_bedroom_smoke_alarm_battery',
              'sensor.den_smoke_alarm_battery',
              'sensor.dining_room_smoke_co_alarm_battery',
              'sensor.fire_co_alarm_battery',
              'sensor.garage_entry_door_battery',
              'sensor.garage_freezer_temp_battery',
              'sensor.garage_fridge_temp_battery',
              'sensor.garage_motion_sensor_battery',
              'sensor.garage_smoke_alarm_battery',
              'sensor.kitchen_freezer_temp_battery',
              'sensor.kitchen_fridge_temp_battery',
              'sensor.laundry_temp_humidity_sensor_battery',
              'sensor.master_bath_temp_humidity_sensor_battery',
              'sensor.master_bedroom_smoke_co_alarm_battery',
              'sensor.office_smoke_alarm_battery',
              'sensor.sarah_bedroom_smoke_alarm_battery',
              'sensor.sump_pump_depth_alert_battery',
              'sensor.hot_water_heater_leak_sensor_battery',
              'sensor.sump_leak_sensor_battery',
              'sensor.sump_pump_running_battery',
              'sensor.well_leak_sensor_battery'
            ] %}
            {% set unavailable = battery_sensors | select('is_state', 'unavailable') | list | length > 0 %}
            {% set critical = battery_sensors | reject('is_state', 'unavailable') | map('states') | select('is_number') | map('int') | select('lt', 15) | list | length > 0 %}
            {% set low = battery_sensors | reject('is_state', 'unavailable') | map('states') | select('is_number') | map('int') | select('lt', 30) | list | length > 0 %}
            {% if unavailable %}
              Offline
            {% elif critical %}
              Critical
            {% elif low %}
              Low
            {% else %}
              Normal
            {% endif %}

# --------------------------------------------------
# Automations
# --------------------------------------------------
automation:
  # =============================================================================
  # SENSOR UNAVAILABLE ALERT
  # Fires when any battery sensor goes unavailable for 10+ minutes.
  # Identifies the specific device by friendly name.
  # =============================================================================
  - id: battery_sensor_unavailable
    alias: "Battery - Sensor Unavailable"
    description: "Alert when a battery sensor goes offline — likely dead battery"
    mode: parallel
    trigger:
      - platform: state
        entity_id:
          - sensor.back_yard_garage_battery
          - sensor.front_door_battery
          - sensor.basement_humidity_sensor_battery
          - sensor.basement_smoke_co_battery
          - sensor.south_bedroom_smoke_alarm_battery
          - sensor.den_smoke_alarm_battery
          - sensor.dining_room_smoke_co_alarm_battery
          - sensor.fire_co_alarm_battery
          - sensor.garage_entry_door_battery
          - sensor.garage_freezer_temp_battery
          - sensor.garage_fridge_temp_battery
          - sensor.garage_motion_sensor_battery
          - sensor.garage_smoke_alarm_battery
          - sensor.kitchen_freezer_temp_battery
          - sensor.kitchen_fridge_temp_battery
          - sensor.laundry_temp_humidity_sensor_battery
          - sensor.master_bath_temp_humidity_sensor_battery
          - sensor.master_bedroom_smoke_co_alarm_battery
          - sensor.office_smoke_alarm_battery
          - sensor.east_suite_smoke_alarm_battery
          - sensor.sump_pump_depth_alert_battery
          - sensor.hot_water_heater_leak_sensor_battery
          - sensor.sump_leak_sensor_battery
          - sensor.sump_pump_running_battery
          - sensor.well_leak_sensor_battery
        to: "unavailable"
        for:
          minutes: 10
    action:
      - service: notify.house_notices
        data:
          title: "Battery Sensor Offline"
          message: |
            Device: {{ state_attr(trigger.entity_id, 'friendly_name') }}
            Status: Unavailable (10+ min)
            Check sensor — likely dead battery
      - service: script.update_battery_status

  # =============================================================================
  # SENSOR RECOVERY
  # Clears status when a previously unavailable sensor comes back online.
  # =============================================================================
  - id: battery_sensor_recovery
    alias: "Battery - Sensor Recovery"
    description: "Update status when a battery sensor comes back online"
    mode: parallel
    trigger:
      - platform: state
        entity_id:
          - sensor.back_yard_garage_battery
          - sensor.front_door_battery
          - sensor.basement_humidity_sensor_battery
          - sensor.basement_smoke_co_battery
          - sensor.south_bedroom_smoke_alarm_battery
          - sensor.den_smoke_alarm_battery
          - sensor.dining_room_smoke_co_alarm_battery
          - sensor.fire_co_alarm_battery
          - sensor.garage_entry_door_battery
          - sensor.garage_freezer_temp_battery
          - sensor.garage_fridge_temp_battery
          - sensor.garage_motion_sensor_battery
          - sensor.garage_smoke_alarm_battery
          - sensor.kitchen_freezer_temp_battery
          - sensor.kitchen_fridge_temp_battery
          - sensor.laundry_temp_humidity_sensor_battery
          - sensor.master_bath_temp_humidity_sensor_battery
          - sensor.master_bedroom_smoke_co_alarm_battery
          - sensor.office_smoke_alarm_battery
          - sensor.east_suite_smoke_alarm_battery
          - sensor.sump_pump_depth_alert_battery
          - sensor.hot_water_heater_leak_sensor_battery
          - sensor.sump_leak_sensor_battery
          - sensor.sump_pump_running_battery
          - sensor.well_leak_sensor_battery
        from: "unavailable"
        for:
          minutes: 2
    action:
      - service: notify.operational_log
        data:
          title: "Battery Sensor Recovered"
          message: |
            Device: {{ state_attr(trigger.entity_id, 'friendly_name') }}
            Battery: {{ states(trigger.entity_id) }}%
            Status: Back online
      - service: script.update_battery_status

  # =============================================================================
  # 30% LOW BATTERY WARNING (Normal Priority)
  # =============================================================================
  - id: battery_low_30_percent
    alias: "Battery - 30% Low Warning"
    description: "Early warning to order replacement batteries"
    mode: parallel
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.back_yard_garage_battery
          - sensor.front_door_battery
          - sensor.basement_humidity_sensor_battery
          - sensor.basement_smoke_co_battery
          - sensor.south_bedroom_smoke_alarm_battery
          - sensor.den_smoke_alarm_battery
          - sensor.dining_room_smoke_co_alarm_battery
          - sensor.fire_co_alarm_battery
          - sensor.garage_entry_door_battery
          - sensor.garage_freezer_temp_battery
          - sensor.garage_fridge_temp_battery
          - sensor.garage_motion_sensor_battery
          - sensor.garage_smoke_alarm_battery
          - sensor.kitchen_freezer_temp_battery
          - sensor.kitchen_fridge_temp_battery
          - sensor.laundry_temp_humidity_sensor_battery
          - sensor.master_bath_temp_humidity_sensor_battery
          - sensor.master_bedroom_smoke_co_alarm_battery
          - sensor.office_smoke_alarm_battery
          - sensor.east_suite_smoke_alarm_battery
          - sensor.sump_pump_depth_alert_battery
          - sensor.hot_water_heater_leak_sensor_battery
          - sensor.sump_leak_sensor_battery
          - sensor.sump_pump_running_battery
          - sensor.well_leak_sensor_battery
        below: 30
        for:
          minutes: 5
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state | int(0) > 15 }}"
    action:
      - service: notify.battery_alerts
        data:
          title: "Low Battery Warning"
          message: |
            Device: {{ state_attr(trigger.entity_id, 'friendly_name') }}
            Battery Level: {{ states(trigger.entity_id) }}%
            
            Order replacement battery
      - service: script.update_battery_status

  # =============================================================================
  # 15% CRITICAL BATTERY ALERT (High Priority - HOUSE ALERTS)
  # =============================================================================
  - id: battery_critical_15_percent
    alias: "Battery - 15% Critical Alert"
    description: "Urgent warning to replace battery immediately - routes to House Alerts"
    mode: parallel
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.back_yard_garage_battery
          - sensor.front_door_battery
          - sensor.basement_humidity_sensor_battery
          - sensor.basement_smoke_co_battery
          - sensor.south_bedroom_smoke_alarm_battery
          - sensor.den_smoke_alarm_battery
          - sensor.dining_room_smoke_co_alarm_battery
          - sensor.fire_co_alarm_battery
          - sensor.garage_entry_door_battery
          - sensor.garage_freezer_temp_battery
          - sensor.garage_fridge_temp_battery
          - sensor.garage_motion_sensor_battery
          - sensor.garage_smoke_alarm_battery
          - sensor.kitchen_freezer_temp_battery
          - sensor.kitchen_fridge_temp_battery
          - sensor.laundry_temp_humidity_sensor_battery
          - sensor.master_bath_temp_humidity_sensor_battery
          - sensor.master_bedroom_smoke_co_alarm_battery
          - sensor.office_smoke_alarm_battery
          - sensor.east_suite_smoke_alarm_battery
          - sensor.sump_pump_depth_alert_battery
          - sensor.hot_water_heater_leak_sensor_battery
          - sensor.sump_leak_sensor_battery
          - sensor.sump_pump_running_battery
          - sensor.well_leak_sensor_battery
        below: 15
        for:
          minutes: 5
    action:
      - service: notify.house_alerts
        data:
          title: "CRITICAL Battery Alert"
          message: |
            Device: {{ state_attr(trigger.entity_id, 'friendly_name') }}
            Battery Level: {{ states(trigger.entity_id) }}%
            
            REPLACE IMMEDIATELY
      - service: script.update_battery_status

  # =============================================================================
  # DAILY BATTERY STATUS UPDATE — 23:55
  # =============================================================================
  - id: battery_status_daily_update
    alias: "Battery - Daily Status Update"
    description: "Update battery status helper at end of day with other reports"
    trigger:
      - platform: time
        at: "23:55:00"
    action:
      - service: script.update_battery_status