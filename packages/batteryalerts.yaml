###############################################################################
# BATTERY MONITORING PACKAGE
# /config/packages/batteryalerts.yaml
#
# Daily poll of all battery sensors using device_class: battery.
# No entity lists required — new devices are included automatically.
# Mobile devices (phones, tablets) are excluded via mobile_app filter.
# Sends a consolidated notification only when action is needed.
# Maintains a status helper for Android Auto display.
###############################################################################

# --------------------------------------------------
# Battery Status Helper (visible to all YAML files)
# --------------------------------------------------
input_text:
  battery_status:
    name: "Battery Status"
    initial: "Normal"

# --------------------------------------------------
# Scripts
# --------------------------------------------------
script:

  # ---------------------------------------------------------------------------
  # On-demand report triggered from status web page.
  # Lists all sensors at <=25% or unavailable, excluding mobile devices.
  # Confirms all healthy when nothing needs attention.
  # ---------------------------------------------------------------------------
  battery_status_report:
    alias: "Battery Status Report"
    sequence:
      - action: notify.battery_alerts
        data:
          title: "Battery Status Report"
          message: >
            {% set ns = namespace(msg='') %}
            {% for sensor in states.sensor
               | selectattr('attributes.device_class', 'eq', 'battery')
               | rejectattr('entity_id', 'in', integration_entities('mobile_app')) %}
              {% if sensor.state == 'unavailable' %}
                {% set ns.msg = ns.msg + device_name(sensor.entity_id) + ': Unavailable\n' %}
              {% elif sensor.state | float(-1) <= 25 and sensor.state | float(-1) >= 0 %}
                {% set ns.msg = ns.msg + device_name(sensor.entity_id) + ': ' + sensor.state + '%\n' %}
              {% endif %}
            {% endfor %}
            {% if ns.msg == '' %}
              All batteries above 25% and online
            {% else %}
              {{ ns.msg }}
            {% endif %}

  # ---------------------------------------------------------------------------
  # Updates the battery_status input_text helper for Android Auto display.
  # Offline takes priority over Low; Low takes priority over Normal.
  # Mobile devices are excluded.
  # ---------------------------------------------------------------------------
  update_battery_status:
    alias: "Update Battery Status"
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.battery_status
        data:
          value: >
            {% set sensors = states.sensor
               | selectattr('attributes.device_class', 'eq', 'battery')
               | rejectattr('entity_id', 'in', integration_entities('mobile_app'))
               | list %}
            {% set unavailable = sensors
               | selectattr('state', 'equalto', 'unavailable')
               | list | length > 0 %}
            {% set ns = namespace(low=false) %}
            {% for sensor in sensors %}
              {% if sensor.state != 'unavailable'
                 and sensor.state | float(-1) <= 25
                 and sensor.state | float(-1) >= 0 %}
                {% set ns.low = true %}
              {% endif %}
            {% endfor %}
            {% if unavailable %}
              Offline
            {% elif ns.low %}
              Low
            {% else %}
              Normal
            {% endif %}

# --------------------------------------------------
# Automations
# --------------------------------------------------
automation:

  # ---------------------------------------------------------------------------
  # Runs nightly at 23:55.
  # Updates the battery status helper regardless of battery state.
  # Sends a notification only when one or more sensors are at <=25% or
  # unavailable — silent when all batteries are healthy.
  # Mobile devices are excluded.
  # Device names identify the brand, making urgency self-evident.
  # ---------------------------------------------------------------------------
  - id: battery_daily_check
    alias: "Battery - Daily Check"
    description: "Nightly poll of all battery sensors — notifies only when action needed"
    trigger:
      - platform: time
        at: "23:55:00"
    action:
      - service: script.update_battery_status
      - variables:
          battery_message: >
            {% set ns = namespace(items=[]) %}
            {% for sensor in states.sensor
               | selectattr('attributes.device_class', 'eq', 'battery')
               | rejectattr('entity_id', 'in', integration_entities('mobile_app')) %}
              {% if sensor.state == 'unavailable' %}
                {% set ns.items = ns.items + [device_name(sensor.entity_id) + ': Unavailable'] %}
              {% elif sensor.state | float(-1) <= 25 and sensor.state | float(-1) >= 0 %}
                {% set ns.items = ns.items
                   + [device_name(sensor.entity_id) + ': ' + sensor.state + '%'] %}
              {% endif %}
            {% endfor %}
            {{ ns.items | join('\n') }}
      - condition: template
        value_template: "{{ battery_message | trim != '' }}"
      - service: notify.battery_alerts
        data:
          title: "Battery Alert"
          message: "{{ battery_message }}"