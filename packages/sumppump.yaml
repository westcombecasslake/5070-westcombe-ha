################################################################################
# SUMP PUMP MONITORING SYSTEM
################################################################################
# Comprehensive monitoring for sump pump activity with adaptive failure detection
#
# Features:
# - Daily cycle tracking
# - Gallons pumped calculation (1.7 gal/cycle based on sump geometry)
# - Monthly water volume totals
# - Daily summary notifications at 11:55 PM (hard end of day)
# - Adaptive anomaly detection based on rainfall and pump history
# - Live sump depth and floor moisture status on all notifications
#
# Requirements:
# - YoLink door sensor wired to Functional Devices power sensor
# - Binary sensor entity: binary_sensor.sump_pump_running
# - Weather integration: Met.no (weather.forecast_home_2)
# - Rainfall proxy: weather state mapped to approximate inches (pouring=0.75, rainy=0.25, other=0)
# - Depth bobber: binary_sensor.sump_pump_depth_alert_door (off=Normal, on=HIGH!)
# - Leak sensor: binary_sensor.sump_leak_sensor_moisture (off=Dry, on=WET!)
# - Notifications via Pushover (see Operational Log, House Alerts, House Notices)
#
# Alerts:
# - Pump failure during rain events
# - Activity drop during wet conditions
# - Extended dry period notices
#
# Notes:
# - Monthly total in notification calculated inline to include current day
# - All input_number helpers persist across restarts (no initial: values)
################################################################################

input_number:
  sump_pump_gallons_per_cycle:
    name: Sump Pump Gallons Per Cycle
    min: 1
    max: 20
    step: 0.1
    unit_of_measurement: "gal"
    icon: mdi:water-pump

  sump_pump_monthly_gallons:
    name: Sump Pump Monthly Gallons
    min: 0
    max: 100000
    step: 0.1
    unit_of_measurement: "gal"
    icon: mdi:counter

input_datetime:
  sump_pump_last_cycle_time:
    name: Sump Pump Last Cycle Time
    has_date: true
    has_time: true

sensor:
  - platform: history_stats
    name: Sump Pump Daily Cycles
    entity_id: binary_sensor.sump_pump_running
    state: "on"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Sump Pump 7 Day Cycles
    entity_id: binary_sensor.sump_pump_running
    state: "on"
    type: count
    start: "{{ now() - timedelta(days=7) }}"
    end: "{{ now() }}"

template:
  - sensor:
      - name: "Sump Pump Daily Gallons"
        unit_of_measurement: "gal"
        state: >
          {% set cycles = states('sensor.sump_pump_daily_cycles') | int(0) %}
          {% set gal_per_cycle = states('input_number.sump_pump_gallons_per_cycle') | float(1.7) %}
          {{ (cycles * gal_per_cycle) | round(1) }}
        icon: mdi:water

      - name: "Sump Pump 7 Day Average Cycles"
        unit_of_measurement: "cycles/day"
        state: >
          {% set total_cycles = states('sensor.sump_pump_7_day_cycles') | int(0) %}
          {{ (total_cycles / 7) | round(1) }}
        icon: mdi:chart-line

      - name: "Rainfall 24 Hours"
        unit_of_measurement: "in"
        state: >
          {% set weather = states('weather.forecast_home_2') %}
          {% if weather == 'pouring' %}
            0.75
          {% elif weather in ['rainy', 'lightning-rainy', 'snowy-rainy'] %}
            0.25
          {% else %}
            0.0
          {% endif %}
        icon: mdi:weather-rainy

      - name: "Sump Pump Hours Since Last Cycle"
        unit_of_measurement: "hrs"
        state: >
          {% set last = states('input_datetime.sump_pump_last_cycle_time') %}
          {% if last not in ['unknown', 'unavailable', ''] %}
            {{ ((now() - as_local(as_datetime(last))).total_seconds() / 3600) | round(1) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:clock-outline

      - name: "Sump Pump Expected Max Idle Hours"
        unit_of_measurement: "hrs"
        state: >
          {% set rain = states('sensor.rainfall_24_hours') | float(0) %}
          {% if rain > 0.5 %}
            12
          {% elif rain > 0.1 %}
            48
          {% else %}
            72
          {% endif %}
        icon: mdi:timer-sand

automation:
  - id: sump_pump_record_last_cycle
    alias: Sump Pump Record Last Cycle Time
    description: >
      Stamps input_datetime on real off-to-on transitions only, excluding
      unavailable-to-on glitches. Resumed notice fires before the stamp so
      the hours value still reflects the previous cycle time, not the new one.
    trigger:
      - platform: state
        entity_id: binary_sensor.sump_pump_running
        to: "on"
        from: "off"
    action:
      - if:
          - condition: template
            value_template: >
              {{ states('sensor.sump_pump_hours_since_last_cycle') | float(0) > 24 }}
        then:
          - service: notify.operational_log
            data:
              title: "✓ Sump Pump Resumed"
              message: |
                Pump cycled after {{ states('sensor.sump_pump_hours_since_last_cycle') | round(0) }} hours idle
                Monitoring resumed

                Sump Water Depth: {% if is_state('binary_sensor.sump_pump_depth_alert_door', 'off') %}Normal{% else %}HIGH!{% endif %} | Floor: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sump_pump_last_cycle_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: sump_pump_daily_summary
    alias: Sump Pump Daily Summary
    description: Send daily pump activity summary at 11:55 PM. Monthly total calculated inline to include today.
    trigger:
      - platform: time
        at: "23:55:00"
    action:
      - service: notify.operational_log
        data:
          title: "Sump Pump Daily"
          message: |
            Cycles {{ states('sensor.sump_pump_daily_cycles') }} | 7-Day Avg {{ states('sensor.sump_pump_7_day_average_cycles') }} cycles/day
            {{ states('sensor.sump_pump_daily_gallons') }} Gallons | Month: {{ (states('input_number.sump_pump_monthly_gallons') | float(0) + states('sensor.sump_pump_daily_gallons') | float(0)) | round(1) }}
            
            Sump Water Depth: {% if is_state('binary_sensor.sump_pump_depth_alert_door', 'off') %}Normal{% else %}HIGH!{% endif %} | Floor: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}

  - id: sump_pump_daily_reset
    alias: Sump Pump Daily Reset
    description: Add daily gallons to monthly total after summary sent
    trigger:
      - platform: time
        at: "23:56:00"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.sump_pump_monthly_gallons
        data:
          value: >
            {{ (states('input_number.sump_pump_monthly_gallons') | float(0) + 
                states('sensor.sump_pump_daily_gallons') | float(0)) | round(1) }}

  - id: sump_pump_monthly_reset
    alias: Sump Pump Monthly Reset
    description: Reset monthly gallon counter on first of month
    trigger:
      - platform: time
        at: "00:00:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.sump_pump_monthly_gallons
        data:
          value: 0

  - id: sump_pump_failure_rain_alert
    alias: Sump Pump Failure During Rain Alert
    description: Alert if no pump activity during rainfall
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set hours_idle = states('sensor.sump_pump_hours_since_last_cycle') | float(0) %}
          {% set rain = states('sensor.rainfall_24_hours') | float(0) %}
          {% set max_idle = states('sensor.sump_pump_expected_max_idle_hours') | float(72) %}
          {{ hours_idle > max_idle and rain > 0.1 }}
        for:
          minutes: 5
    condition:
      - condition: template
        value_template: >
          {{ states('sensor.rainfall_24_hours') | float(0) > 0.1 }}
      - condition: template
        value_template: >
          {% set last_alert = state_attr('automation.sump_pump_failure_rain_alert', 'last_triggered') %}
          {% if last_alert %}
            {{ (now() - last_alert).total_seconds() > 14400 }}
          {% else %}
            true
          {% endif %}
    action:
      - service: notify.house_alerts
        data:
          title: "⚠️ Sump Pump Alert"
          message: |
            No pump activity in {{ states('sensor.sump_pump_hours_since_last_cycle') }} hours
            Despite {{ states('sensor.rainfall_24_hours') }}" rainfall. Check pump!
            
            Sump Water Depth: {% if is_state('binary_sensor.sump_pump_depth_alert_door', 'off') %}Normal{% else %}HIGH!{% endif %} | Floor: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}

  - id: sump_pump_activity_drop_alert
    alias: Sump Pump Activity Drop Alert
    description: Alert if cycles drop significantly below average during wet conditions
    mode: single
    trigger:
      - platform: time
        at: "23:50:00"
    condition:
      - condition: template
        value_template: >
          {% set today_cycles = states('sensor.sump_pump_daily_cycles') | int(0) %}
          {% set avg_cycles = states('sensor.sump_pump_7_day_average_cycles') | float(0) %}
          {% set rain = states('sensor.rainfall_24_hours') | float(0) %}
          {{ today_cycles < (avg_cycles * 0.5) and avg_cycles > 5 and rain > 0.5 }}
    action:
      - service: notify.house_alerts
        data:
          title: "⚠️ Sump Pump Alert"
          message: |
            Only {{ states('sensor.sump_pump_daily_cycles') }} cycles today
            (vs 7-day avg of {{ states('sensor.sump_pump_7_day_average_cycles') }} cycles)
            Rained {{ states('sensor.rainfall_24_hours') }}" in last 24hrs. Check pump!
            
            Sump Water Depth: {% if is_state('binary_sensor.sump_pump_depth_alert_door', 'off') %}Normal{% else %}HIGH!{% endif %} | Floor: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}

  - id: sump_pump_extended_dry_notice
    alias: Sump Pump Extended Dry Period Notice
    description: Informational notice during extended dry periods
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set hours_idle = states('sensor.sump_pump_hours_since_last_cycle') | float(0) %}
          {{ hours_idle > 96 }}
        for:
          hours: 1
    condition:
      - condition: template
        value_template: >
          {{ states('sensor.rainfall_24_hours') | float(0) < 0.1 }}
    action:
      - service: notify.house_notices
        data:
          title: "ℹ️ Sump Pump Notice"
          message: |
            No pump activity in {{ states('sensor.sump_pump_hours_since_last_cycle') | round(0) }} hours
            No recent rain - likely normal
            
            Sump Water Depth: {% if is_state('binary_sensor.sump_pump_depth_alert_door', 'off') %}Normal{% else %}HIGH!{% endif %} | Floor: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}

  - id: sump_pump_high_water_alert
    alias: Sump Pump High Water Alert
    description: Alert when depth sensor indicates HIGH WATER
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.sump_pump_depth_alert_door
        to: "on"
        for: "00:00:30"
    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state.state not in ['unavailable', 'unknown'] }}
    action:
      - service: notify.house_alerts
        data:
          title: "🚨 Sump HIGH WATER"
          message: |
            Depth sensor: HIGH WATER
            Floor moisture: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}

  - id: sump_pump_high_water_cleared
    alias: Sump Pump High Water Cleared
    description: Notify when depth sensor returns to normal after HIGH WATER
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.sump_pump_depth_alert_door
        to: "off"
    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state.state == 'on' }}
    action:
      - service: notify.house_alerts
        data:
          title: "✓ Sump Depth Normal"
          message: |
            Depth sensor: Normal
            Floor moisture: {% if is_state('binary_sensor.sump_leak_sensor_moisture', 'on') %}WET!{% else %}Dry{% endif %}