# ==================================================
# Master Bath Humidity Control
#
# Features:
#   - Relative rise detection, works year-round
#   - Comfort delay before fan turns on (adjustable)
#   - 15-minute minimum runtime
#   - Drops to 25% of peak rise before shutting off
#   - 2-hour safety timeout
#   - Manual fan 15-minute auto-off
#   - HVAC exhaust boost after cycle
# ==================================================

input_number:
  master_bath_humidity_baseline:
    name: Master Bath Humidity Baseline
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  master_bath_humidity_peak:
    name: Master Bath Humidity Peak
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent-alert

  master_bath_humidity_last_update:
    name: Master Bath Humidity Last Update
    min: 0
    max: 9999999999
    step: 1
    mode: box

  master_bath_fan_loop_start:
    name: Master Bath Fan Loop Start
    min: 0
    max: 9999999999
    step: 1
    mode: box

automation:
  # --------------------------------------------------
  # Master Bath Humidity - Shower Detection (Polling)
  # --------------------------------------------------
  - id: master_bath_humidity_shower_detection
    alias: "Master Bath Humidity - Shower Detection"
    trigger:
      - platform: time_pattern
        seconds: "/30"
    action:
      - variables:
          current_humidity: "{{ states('sensor.master_bath_humidity') | float(0) }}"
          baseline: "{{ states('input_number.master_bath_humidity_baseline') | float(0) }}"
          peak: "{{ states('input_number.master_bath_humidity_peak') | float(0) }}"
          fan_state: "{{ states('light.master_bath_fan') }}"
          loop_start: "{{ states('input_number.master_bath_fan_loop_start') | float(0) }}"
          time_now: "{{ now().timestamp() }}"
          time_since_loop_start: "{{ (time_now - loop_start) if loop_start > 0 else 0 }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.master_bath_humidity_last_update
        data:
          value: "{{ time_now }}"

      - choose:
          # --------------------------------------------------
          # Case 1: Fan is running
          # Inner choose handles timeout vs normal shutdown.
          # Both paths always reachable.
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'on' and baseline > 0 }}"
            sequence:
              - variables:
                  peak_rise: "{{ peak - baseline }}"
                  current_rise: "{{ current_humidity - baseline }}"
                  target_rise: "{{ peak_rise * 0.25 }}"
                  elapsed_minutes: "{{ time_since_loop_start / 60 }}"

              - choose:
                  # Safety timeout: force off after 2 hours
                  - conditions:
                      - condition: template
                        value_template: "{{ time_since_loop_start >= 7200 }}"
                    sequence:
                      - service: light.turn_off
                        target:
                          entity_id: light.master_bath_fan
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_humidity_baseline
                        data:
                          value: 0
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_humidity_peak
                        data:
                          value: 0
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_fan_loop_start
                        data:
                          value: 0
                      - service: notify.house_alerts
                        data:
                          title: "Master Bath Fan Safety Timeout"
                          message: >
                            Fan forced off after 2-hour timeout.
                            Check humidity sensor and automation logic.

                  # Normal shutdown: 15 min elapsed and
                  # humidity dropped to 25% of peak rise
                  - conditions:
                      - condition: template
                        value_template: >
                          {{ elapsed_minutes >= 15 and
                             current_rise <= target_rise }}
                    sequence:
                      - service: light.turn_off
                        target:
                          entity_id: light.master_bath_fan
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_humidity_baseline
                        data:
                          value: 0
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_humidity_peak
                        data:
                          value: 0
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_fan_loop_start
                        data:
                          value: 0
                      - service: script.hvac_exhaust_boost
                        data: {}

          # --------------------------------------------------
          # Case 2: Detecting shower
          # Lock baseline and peak at detection, wait comfort
          # delay, turn fan on. No re-check.
          # --------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ fan_state == 'off' and baseline == 0 }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {% set threshold = 8 if current_humidity < 50 else 5 %}
                          {{ peak > 0 and (current_humidity - peak) >= threshold }}
                    sequence:
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_humidity_baseline
                        data:
                          value: "{{ peak | float(0) }}"
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_humidity_peak
                        data:
                          value: "{{ current_humidity | float(0) }}"
                      # Comfort delay - adjust to taste
                      - delay: "00:01:30"
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.master_bath_fan_loop_start
                        data:
                          value: "{{ now().timestamp() }}"
                      - service: light.turn_on
                        target:
                          entity_id: light.master_bath_fan

                default:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.master_bath_humidity_peak
                    data:
                      value: "{{ current_humidity }}"

  # --------------------------------------------------
  # Master Bath Humidity - Timeout Reset
  # --------------------------------------------------
  - id: master_bath_humidity_timeout
    alias: "Master Bath Humidity - Timeout"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: light.master_bath_fan
        state: "off"
      - condition: template
        value_template: >
          {% set last_update = states('input_number.master_bath_humidity_last_update') | float(0) %}
          {% set time_now = now().timestamp() %}
          {{ (time_now - last_update) > 900 }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.master_bath_humidity_baseline
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.master_bath_humidity_peak
        data:
          value: 0

  # --------------------------------------------------
  # Master Bath Fan - Manual Timer
  # --------------------------------------------------
  - id: master_bath_fan_manual_timer
    alias: "Master Bath Fan - Manual Timer"
    trigger:
      - platform: state
        entity_id: light.master_bath_fan
        to: "on"
    condition:
      - condition: template
        value_template: >
          {{ states('input_number.master_bath_humidity_baseline') | float(0) == 0 }}
    action:
      - delay: "00:15:00"
      - service: light.turn_off
        target:
          entity_id: light.master_bath_fan

  # --------------------------------------------------
  # Master Bath Humidity - Startup Reset
  # --------------------------------------------------
  - id: master_bath_humidity_startup_reset
    alias: "Master Bath Humidity - Startup Reset"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.master_bath_humidity_baseline
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.master_bath_humidity_peak
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.master_bath_fan_loop_start
        data:
          value: 0
      - service: light.turn_off
        target:
          entity_id: light.master_bath_fan