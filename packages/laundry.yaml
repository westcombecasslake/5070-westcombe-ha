###############################################################################
# LAUNDRY DRYER FAN - SMART BASELINE PACKAGE
###############################################################################
# Place this file in: /config/packages/laundry.yaml
#
# OVERVIEW:
# Automatically controls a laundry room exhaust fan based on dryer usage and
# temperature monitoring. Uses adaptive baseline temperature tracking to
# efficiently manage fan runtime.
#
# AUTOMATIONS:
# 1. laundry_dryer_fan_control (Main) — mode: restart
#    - Detects dryer ON (>200W) - Sets temperature baseline & turns fan ON
#    - Detects dryer OFF (<2W) - Waits for temp to drop to baseline+3F
#    - 20-minute timeout acts as failsafe if sensor goes quiet
#    - 10-minute runout after threshold brings room closer to baseline
#    - Triggers HVAC exhaust boost script when fan turns off
#    - NOTE: mode:restart means a new dryer_off trigger during cooldown cancels
#      and restarts cooldown with a fresh 20-minute deadline
#
# 2. laundry_baseline_timeout (Maintenance) — mode: single
#    - Resets temperature baseline to 0 after 4 hours of dryer inactivity
#    - Runs every 30 minutes to check for stale baseline data
#    - Only resets if baseline > 0 (guard against redundant resets)
#
# REQUIRED ENTITIES (not in this package):
# - sensor.dryer_monitor_current_power (power monitoring sensor)
# - sensor.laundry_temperature (Inovelli switch temp sensor)
# - switch.laundry_fan_timer (fan switch/relay)
# - script.hvac_exhaust_boost (HVAC boost script in scripts.yaml)
#
# BASELINE LOGIC:
# - Baseline updates when dryer turns ON if:
#   - Current temp < stored baseline (room cooled down), OR
#   - Baseline is 0 (uninitialized), OR
#   - Dryer off for 4+ hours (14400 seconds)
#
###############################################################################

input_number:
  laundry_temp_baseline:
    name: Laundry Temperature Baseline
    min: 0
    max: 120
    step: 0.1
    mode: box

  laundry_dryer_last_off:
    name: Laundry Dryer Last Off Timestamp
    min: 0
    max: 9999999999
    step: 1
    mode: box

automation:
  - id: laundry_dryer_fan_control
    alias: "Laundry - Dryer Fan Control (Standalone)"
    mode: restart

    trigger:
      - id: dryer_on
        platform: numeric_state
        entity_id: sensor.dryer_monitor_current_power
        above: 200

      - id: dryer_off
        platform: numeric_state
        entity_id: sensor.dryer_monitor_current_power
        below: 2

    action:
      - choose:
          # --------------------------------------------------
          # DRYER ON - Set baseline and turn fan ON
          # --------------------------------------------------
          - conditions:
              - condition: trigger
                id: dryer_on
            sequence:
              - variables:
                  current_temp: "{{ states('sensor.laundry_temperature') | float(0) }}"
                  stored_baseline: "{{ states('input_number.laundry_temp_baseline') | float(0) }}"
                  last_off_time: "{{ states('input_number.laundry_dryer_last_off') | float(0) }}"
                  time_since_off: "{{ as_timestamp(now()) - last_off_time }}"

              # Update baseline ONLY if:
              # 1. Current temp is lower than stored baseline (room cooled down), OR
              # 2. Baseline is 0 (uninitialized), OR
              # 3. Dryer has been off for 4+ hours (14400 seconds)
              - if:
                  - condition: template
                    value_template: >
                      {{ stored_baseline == 0 or
                         current_temp < stored_baseline or
                         time_since_off > 14400 }}
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.laundry_temp_baseline
                    data:
                      value: "{{ current_temp }}"

              - service: switch.turn_on
                target:
                  entity_id: switch.laundry_fan_timer

          # --------------------------------------------------
          # DRYER OFF - Wait for cooldown with 20-min failsafe
          # then 10-min runout to bring room closer to baseline
          # --------------------------------------------------
          - conditions:
              - condition: trigger
                id: dryer_off
            sequence:
              # Update last off timestamp
              - service: input_number.set_value
                target:
                  entity_id: input_number.laundry_dryer_last_off
                data:
                  value: "{{ as_timestamp(now()) }}"

              # Wait for temp to drop to baseline + 3F
              # Inovelli sensor fires state change events on temp change — no polling needed
              # continue_on_timeout: true ensures fan turns off even if sensor goes quiet
              - wait_for_trigger:
                  - platform: template
                    value_template: >
                      {% set current = states('sensor.laundry_temperature') | float(0) %}
                      {% set baseline = states('input_number.laundry_temp_baseline') | float(0) %}
                      {{ current <= (baseline + 3) }}
                timeout: "00:20:00"
                continue_on_timeout: true

              # Runout — continue fan for 10 minutes after threshold met
              # brings room closer to baseline before HVAC boost takes over
              - delay: "00:10:00"

              # Cooldown complete - turn fan OFF
              - service: switch.turn_off
                target:
                  entity_id: switch.laundry_fan_timer

              # Trigger HVAC exhaust boost
              - service: script.hvac_exhaust_boost

        default: []

  # --------------------------------------------------
  # TIMEOUT: Reset baseline after 4 hours of inactivity
  # --------------------------------------------------
  - id: laundry_baseline_timeout
    alias: "Laundry - Reset Baseline After 4 Hours"
    mode: single

    trigger:
      - platform: time_pattern
        minutes: "/30"

    condition:
      - condition: template
        value_template: >
          {% set baseline = states('input_number.laundry_temp_baseline') | float(0) %}
          {% set last_off = states('input_number.laundry_dryer_last_off') | float(0) %}
          {% set age = as_timestamp(now()) - last_off %}
          {{ baseline > 0 and age > 14400 }}

    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.laundry_temp_baseline
        data:
          value: 0